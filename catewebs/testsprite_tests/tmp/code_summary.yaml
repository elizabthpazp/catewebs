version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Next.js 14 (App Router)
  - React 18
  - NextUI
  - Tailwind CSS
  - Framer Motion
  - next-themes (dark/light mode)
  - Zod (form validation)
  - i18n (English/Spanish)
routes:
  - path: /en
    file: src/app/[lang]/page.tsx
    auth_required: false
    description: Homepage with hero section, service cards, Instagram embed, and CTA buttons
  - path: /es
    file: src/app/[lang]/page.tsx
    auth_required: false
    description: Homepage in Spanish
  - path: /en/about
    file: src/app/[lang]/about/page.tsx
    auth_required: false
    description: About page with company description and logo
  - path: /es/about
    file: src/app/[lang]/about/page.tsx
    auth_required: false
    description: About page in Spanish
  - path: /en/pricing
    file: src/app/[lang]/pricing/page.tsx
    auth_required: false
    description: Pricing page with 3 plan tiers (Basic, Standard, Premium)
  - path: /es/pricing
    file: src/app/[lang]/pricing/page.tsx
    auth_required: false
    description: Pricing page in Spanish
  - path: /en/services
    file: src/app/[lang]/services/page.tsx
    auth_required: false
    description: Services page listing web development, marketing, SEO, design, e-commerce, and system design
  - path: /es/services
    file: src/app/[lang]/services/page.tsx
    auth_required: false
    description: Services page in Spanish
  - path: /en/contact
    file: src/app/[lang]/contact/page.tsx
    auth_required: false
    description: Contact page with contact information and a contact form
  - path: /es/contact
    file: src/app/[lang]/contact/page.tsx
    auth_required: false
    description: Contact page in Spanish
features:
  - name: Navigation
    description: Header with navigation links to all pages, mobile hamburger menu, and social media links
    files:
      - src/components/Header.tsx
    entry_route: /en
    user_interactions:
      - Click navigation links (Home, Pricing, Services, About, Contact)
      - Open mobile menu via hamburger icon
      - Close mobile menu
      - Click CTA button in mobile menu
    api_calls: []
    auth_required: false
  - name: Language Switching
    description: Switch between English and Spanish locales via dropdown in header
    files:
      - src/components/LocaleSwitcher.tsx
      - src/middleware.ts
      - i18n-config.ts
    entry_route: /en
    user_interactions:
      - Click language switcher dropdown
      - Select English or Spanish locale
      - Page reloads with new locale
    api_calls: []
    auth_required: false
  - name: Theme Switching
    description: Toggle between dark and light mode
    files:
      - src/components/ThemeSwitcher.tsx
      - src/app/[lang]/providers.tsx
    entry_route: /en
    user_interactions:
      - Click theme toggle button
      - Page switches between dark and light mode
    api_calls: []
    auth_required: false
  - name: Contact Form
    description: Form to send a message with name, email, phone, and message fields with Zod validation
    files:
      - src/components/ContactForm.tsx
      - src/lib/contactValidation.ts
    entry_route: /en/contact
    user_interactions:
      - Fill in name input field
      - Fill in email input field
      - Fill in phone input field (optional)
      - Fill in message textarea
      - Click Send Message button
      - See validation error messages on invalid input
      - See success message after submission
      - See error message on failed submission
    api_calls: []
    auth_required: false
  - name: Pricing Plans Display
    description: Display three pricing tiers with features list and CTA buttons linking to Telegram
    files:
      - src/app/[lang]/pricing/page.tsx
    entry_route: /en/pricing
    user_interactions:
      - View pricing plans with features
      - Click CTA button to contact via Telegram
    api_calls: []
    auth_required: false
  - name: Services Listing
    description: Display six service cards with images and descriptions
    files:
      - src/app/[lang]/services/page.tsx
    entry_route: /en/services
    user_interactions:
      - View service cards with images and descriptions
    api_calls: []
    auth_required: false
  - name: Homepage Hero and CTA
    description: Hero section with title, subtitle, and call-to-action buttons linking to Telegram and contact form
    files:
      - src/app/[lang]/page.tsx
      - src/components/Card.tsx
    entry_route: /en
    user_interactions:
      - View hero section with title and subtitle
      - Click Telegram CTA button
      - Click Contact Form button
      - View service highlight cards
    api_calls: []
    auth_required: false
  - name: Instagram Embed
    description: Embedded Instagram content section on homepage
    files:
      - src/components/Instagram.tsx
    entry_route: /en
    user_interactions:
      - View embedded Instagram content
      - Click Instagram button link
    api_calls: []
    auth_required: false
known_limitations:
  - issue: Contact form submission is simulated with a timeout, not connected to a real backend API
    location: src/components/ContactForm.tsx
    impact: Form submissions are not actually sent or persisted
  - issue: Memory leak in ContactForm due to setInterval without cleanup in useEffect
    location: src/components/ContactForm.tsx
    impact: Console logging continues indefinitely after component unmounts
